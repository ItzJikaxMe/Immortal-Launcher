name: Immortal Launcher Android Build

on:
  push:
    branches:
      - main
      - mojo-engine-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Immortal Launcher (Mojo engine)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Immortal and Mojo sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Apply Immortal package, icon and purple theme
        shell: bash
        run: |
          set -euo pipefail
          APP=mojo/app_mojo
          GRADLE_FILE="$APP/build.gradle"
          RES="$APP/src/main/res"

          # Keep Mojo's engine code, but install and identify it as Immortal.
          sed -i 's/applicationId "git.artdeell.mjlaunch"/applicationId "com.immortal.launcher"/' "$GRADLE_FILE"
          sed -i "/applicationIdSuffix '.debug'/d" "$GRADLE_FILE"
          sed -i "s/git.artdeell.mjlaunch.debug/com.immortal.launcher/g" "$GRADLE_FILE"
          sed -i "s/git.artdeell.mjlaunch.scoped.gamefolder.debug/com.immortal.launcher.scoped.gamefolder.debug/g" "$GRADLE_FILE"
          sed -i "s/git.artdeell.mjlaunch.scoped.gamefolder/com.immortal.launcher.scoped.gamefolder/g" "$GRADLE_FILE"
          sed -i "s/git.artdeell.mjlaunch/com.immortal.launcher/g" "$GRADLE_FILE"

          # Use the supplied Immortal logo as the adaptive icon foreground.
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          cp app/src/main/res/drawable-nodpi/immortal_logo.webp "$RES/drawable-nodpi/immortal_logo.webp"
          cp app/src/main/res/values/immortal_icon.xml "$RES/values/immortal_icon.xml"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/immortal_icon_background"/>
              <foreground android:drawable="@drawable/immortal_logo"/>
          </adaptive-icon>
          XML
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Replace Mojo's green accent palette with Immortal purple while preserving layout.
          COLORS="$RES/values/colors.xml"
          sed -i \
            -e 's/#43D12B/#976FEB/g' \
            -e 's/#7CEF68/#C0A4FF/g' \
            -e 's/#79ED64/#B89AFF/g' \
            -e 's/#67985D/#8064C7/g' \
            -e 's/#5536B82A/#55976FEB/g' \
            -e 's/#172719/#241B35/g' \
            -e 's/#1B351C/#2A203C/g' \
            -e 's/#142518/#21182F/g' "$COLORS"

          grep -q 'applicationId "com.immortal.launcher"' "$GRADLE_FILE"
          grep -q 'immortal_icon_background' "$RES/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Build full-runtime debug APK
        run: gradle -p mojo --no-daemon :app_mojo:assembleFullDebug

      - name: Upload full-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: Immortal-Launcher-full-runtime
          path: mojo/app_mojo/build/outputs/apk/full/debug/app_mojo-full-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build no-runtime debug APK
        run: gradle -p mojo --no-daemon :app_mojo:assembleNoruntimeDebug

      - name: Upload no-runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: Immortal-Launcher-no-runtime
          path: mojo/app_mojo/build/outputs/apk/noruntime/debug/app_mojo-noruntime-debug.apk
          if-no-files-found: error
          retention-days: 14
