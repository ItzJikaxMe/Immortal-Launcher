pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://jitpack.io") }
    }
}

rootProject.name = "ImmortalLauncher"

include(":app")
include(":forge_installer")
include(":NoBlocklist")
include(":glfw:jni_bindings")
include(":mojoexec:jni_bindings")
include(":sdl:jni_bindings")

project(":forge_installer").projectDir = file("engine/mojo/forge_installer")
project(":NoBlocklist").projectDir = file("engine/mojo/NoBlocklist")
project(":glfw").projectDir = file("engine/mojo/glfw")
project(":glfw:jni_bindings").projectDir = file("engine/mojo/glfw/jni_bindings")
project(":mojoexec").projectDir = file("engine/mojo/mojoexec")
project(":mojoexec:jni_bindings").projectDir = file("engine/mojo/mojoexec/jni_bindings")
project(":sdl").projectDir = file("engine/mojo/sdl")
project(":sdl:jni_bindings").projectDir = file("engine/mojo/sdl/jni_bindings")
