plugins {
    id 'com.android.application'
    id 'de.undercouch.download' version '5.6.0'
}

import de.undercouch.gradle.tasks.download.Download

def engineApp = file("$rootDir/engine/mojo/app_mojo")

android {
    // Keep the engine namespace so its existing R and BuildConfig references remain valid.
    // The installed application keeps Immortal's independent package name.
    namespace 'git.artdeell.mojo'
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId 'com.immortal.launcher'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.0'

        resValue 'string', 'curseforge_api_key', 'DUMMY'
        resValue 'string', 'group_id', 'com.immortal'
        resValue 'string', 'application_package', 'com.immortal.launcher'
        resValue 'string', 'storageProviderAuthorities', 'com.immortal.launcher.scoped.gamefolder'

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    sourceSets {
        main {
            java.srcDir file("$engineApp/src/main/java")
            res.srcDir file("$engineApp/src/main/res")
            assets.srcDir file("$engineApp/src/main/assets")
            jniLibs.srcDir file("$engineApp/src/main/jniLibs")
        }
    }

    externalNativeBuild {
        cmake {
            path file("$engineApp/src/main/jni/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ["META-INF/DEPENDENCIES"]
        }
    }

    androidResources {
        noCompress += ["tar.xz", "xz", "zip"]
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.19.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'
    implementation 'org.tukaani:xz:1.10'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29'
    implementation 'com.github.MojoLauncher:alsoft-android-aar:f369161d5f'

    implementation project(":glfw:jni_bindings")
    implementation project(":sdl:jni_bindings")
    implementation fileTree(dir: file("$engineApp/libs"), include: ["*.jar", "*.aar"])
}

// The Java runtime/native launcher is not a loose Java library: several companion
// components must be packaged as assets and extracted before a game session starts.
def generatedEngineAssets = file("$buildDir/generated/immortalEngineAssets")
android.sourceSets.main.assets.srcDir(generatedEngineAssets)

def componentRoot = new File(generatedEngineAssets, "components")
def runtimeArchive = file("$buildDir/downloads/jre8-pojav.zip")
def cacioBase = "https://jitpack.io/com/github/MojoLauncher"

tasks.register("downloadImmortalJre8", Download) {
    src "https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre8-pojav.zip"
    dest runtimeArchive
    overwrite false
}

tasks.register("unpackImmortalJre8", Copy) {
    dependsOn("downloadImmortalJre8")
    from { zipTree(runtimeArchive) }
    into new File(componentRoot, "jre")
}

def cacioDownloads = [
    [name: "cacio-shared", component: "caciocavallo", version: "d0efb5aaba", suffix: ""],
    [name: "cacio-androidnw", component: "caciocavallo", version: "d0efb5aaba", suffix: ""],
    [name: "cacio-tta", component: "caciocavallo17", version: "-411454b006-1", suffix: "-jar-with-dependencies"]
]

def cacioTaskNames = []
cacioDownloads.each { spec ->
    def taskName = "downloadImmortal" + spec.name.replaceAll("[^A-Za-z0-9]", "").capitalize()
    cacioTaskNames.add(taskName)
    tasks.register(taskName, Download) {
        src "\${cacioBase}/\${spec.component}/\${spec.name}/\${spec.version}/\${spec.name}-\${spec.version}\${spec.suffix}.jar"
        dest new File(new File(componentRoot, spec.component), "\${spec.name}-\${spec.version}\${spec.suffix}.jar")
        overwrite false
        doFirst {
            destination.parentFile.mkdirs()
        }
    }
}

tasks.register("prepareImmortalEngineAssets") {
    dependsOn(":forge_installer:jar", ":NoBlocklist:shadowJar", "unpackImmortalJre8")
    dependsOn(cacioTaskNames)
    outputs.dir(generatedEngineAssets)

    doLast {
        def components = new File(generatedEngineAssets, "components")
        def forgeDir = new File(components, "forge_installer")
        def blocklistDir = new File(components, "noblocklist")
        forgeDir.mkdirs()
        blocklistDir.mkdirs()

        copy {
            from project(":forge_installer").tasks.named("jar").get().archiveFile
            into forgeDir
        }
        copy {
            from project(":NoBlocklist").tasks.named("shadowJar").get().archiveFile
            into blocklistDir
        }

        new File(forgeDir, "version").text = "immortal-engine-forge-installer-1"
        new File(blocklistDir, "version").text = "immortal-engine-noblocklist-1"
        new File(new File(components, "caciocavallo"), "version").text = "immortal-engine-cacio-1"
        new File(new File(components, "caciocavallo17"), "version").text = "immortal-engine-cacio17-1"
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareImmortalEngineAssets")
}
